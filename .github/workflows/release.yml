name: "Release Multiplataforma - SNI Tester PRO"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # ==========================================
  # BUILD DESKTOP (Windows .exe / Linux .deb, .AppImage)
  # ==========================================
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          - platform: 'ubuntu-22.04'
            args: '--bundle appimage,deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências no Linux (GTK e WebKit)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do Frontend (na pasta desktop)
        run: |
          cd desktop
          npm install

      - name: Compilar com Tauri Action (.exe, .deb, .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'desktop'
          tagName: ${{ github.ref_name }}
          releaseName: 'SNI Tester PRO ${{ github.ref_name }}'
          releaseBody: 'Nova versão disponível para Windows e Linux!'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}