name: "Release Multiplataforma - SNI Tester PRO"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag da versão (ex: v4.0.5)'
        required: true
        default: 'v4.0.5'

jobs:
  build-desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: '--bundles nsis'
          - platform: 'ubuntu-22.04'
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar dependências no Linux (GTK, WebKit v2 e Ferramentas AppImage)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libappindicator3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            squashfs-tools \
            file \
            pkg-config

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependências do Frontend (se houver package.json)
        run: |
          cd desktop
          if [ -f package.json ]; then npm install; fi

      - name: Compilar com Tauri Action (.exe, .deb, .AppImage)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: 'desktop'
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: 'SNI Tester PRO ${{ github.event.inputs.version || github.ref_name }}'
          releaseBody: 'Nova versão disponível para Windows e Linux!'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}